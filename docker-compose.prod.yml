# 生产部署编排：PostgreSQL + Next 应用 + Nginx
# 使用：docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: crowd-demand

services:
  postgres:
    image: postgres:16-alpine
    container_name: crowd-demand-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crowd_demand}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowd} -d ${POSTGRES_DB:-crowd_demand}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    image: crowd-demand-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowd-demand-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-crowd}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crowd_demand}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      # production（默认，最严格）| demo（仅内部演示，允许 Mock 支付，禁止真实资金）
      APP_ENV: ${APP_ENV:-production}
      SMS_ADAPTER: ${SMS_ADAPTER:-mock}
      KYC_ADAPTER: ${KYC_ADAPTER:-mock}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-mock}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-mock}
      MAX_PLEDGE_AMOUNT_CENTS: ${MAX_PLEDGE_AMOUNT_CENTS:-5000000}
      MAX_USER_PLEDGE_CENTS: ${MAX_USER_PLEDGE_CENTS:-20000000}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: crowd-demand-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - internal

  # 到期结算定时任务：每 5 分钟调用一次内部 cron 接口（F11）
  cron:
    image: crowd-demand-app:local
    container_name: crowd-demand-cron
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          sleep ${CRON_INTERVAL_SECONDS:-300};
          node -e "fetch(process.env.APP_INTERNAL_URL + '/api/internal/cron', { method: 'POST', headers: { 'x-cron-secret': process.env.CRON_SECRET } }).then(r => console.log(new Date().toISOString(), 'cron status', r.status)).catch(e => console.error('cron failed', e.message))";
        done
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      - app
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: crowd-demand-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  internal:
    driver: bridge
